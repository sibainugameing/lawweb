<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#172638">
  <title>ログイン — LawWeb</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v='20261113-ui8') }}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand-name auth-brand-name" href="/" aria-label="LawWeb">LawWeb</a>
      <h1>ログイン</h1>
      <p class="auth-description">法令XML、ルール本文、変更履歴を閲覧できます。</p>
      {% if error %}<div class="auth-alert" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('login_post') }}" class="auth-form" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">ユーザー名</label>
        <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="32" autocapitalize="none" spellcheck="false">
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
        <button class="button button-primary auth-submit" type="submit">ログイン <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">アカウントを持っていませんか？ <a href="{{ url_for('register') }}">新規登録</a></p>
    </section>
    <p class="auth-footnote"><a href="/">戻る</a></p>
  </main>
</body>
</html>
