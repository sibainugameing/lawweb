<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#172638">
  <title>ログイン — LawWeb</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand auth-brand" href="/" aria-label="LawWeb">
        <span class="brand-mark">L<span>.</span></span>
        <span class="brand-copy"><strong>LAW<span>WEB</span></strong><small>LAWGIT WORKSPACE</small></span>
      </a>
      <p class="eyebrow">PRIVATE LEGAL DOCUMENT LIBRARY</p>
      <h1>ログイン</h1>
      <p class="auth-description">LawWebの閲覧にはアカウント認証が必要です。アカウントは運用者がターミナルから発行します。</p>
      {% if error %}<div class="auth-alert" role="alert">{{ error }}</div>{% endif %}
      {% if setup_message %}<div class="auth-notice">{{ setup_message }}</div>{% endif %}
      <form method="post" action="{{ url_for('login_post') }}" class="auth-form" autocomplete="on">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">ユーザー名</label>
        <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="32" autocapitalize="none" spellcheck="false">
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
        <button class="button button-primary auth-submit" type="submit">ログイン <span aria-hidden="true">→</span></button>
      </form>
      <div class="auth-meta"><span>LOCAL ACCESS ONLY</span><span>NO PUBLIC SIGN-UP</span></div>
    </section>
    <p class="auth-footnote">LawWeb · Read-only interface for LawGit</p>
  </main>
</body>
</html>
