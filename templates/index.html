<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172638">
  <title>LawWeb</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body data-authenticated="{{ 'true' if current_user else 'false' }}">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand-name" href="/" aria-label="LawWeb ホーム">LawWeb</a>
      <nav class="main-nav" aria-label="メインメニュー">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">◫</span><span>概要</span></button>
        <button class="nav-item" data-view="laws"><span class="nav-icon">▤</span><span>法令</span></button>
        {% if current_user %}
        <button class="nav-item" data-view="rules"><span class="nav-icon">≡</span><span>ルール</span></button>
        <button class="nav-item" data-view="activity"><span class="nav-icon">↗</span><span>変更履歴</span></button>
        <button class="nav-item" data-view="integrity"><span class="nav-icon">◇</span><span>検証・Git</span></button>
        {% endif %}
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-card">
          <div class="connection-head"><span class="status-dot" id="sidebar-status-dot"></span><span id="sidebar-status">接続を確認中</span></div>
          <p id="sidebar-repo">LawGit API</p>
          </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-heading">
          <h1 id="page-title">概要</h1>
        </div>
        <div class="topbar-actions">
          {% if current_user %}
          <form class="global-search" id="search-form" role="search">
            <span class="search-symbol">⌕</span>
            <input id="global-search" type="search" placeholder="法令・ルールを検索…" autocomplete="off" aria-label="法令・ルールを検索">
            <kbd>↵</kbd>
          </form>
          {% endif %}
          <button class="icon-button" id="refresh-button" title="再読み込み" aria-label="再読み込み">↻</button>
          {% if current_user %}
          <span class="user-pill">{{ current_user.username }}</span>
          <a class="button button-secondary" href="{{ url_for('account_page') }}">アカウント管理</a>
          <form method="post" action="{{ url_for('logout') }}" class="logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="button button-secondary logout-button" type="submit">ログアウト</button>
          </form>
          {% else %}
          <a class="button button-secondary" href="{{ url_for('login') }}">ログイン</a>
          <a class="button button-primary" href="{{ url_for('register') }}">新規登録</a>
          {% endif %}
        </div>
      </header>
      <div class="content" id="view-root" aria-live="polite">
        <div class="loading-state"><span class="loader"></span><p>LawGitに接続しています…</p></div>
      </div>
    </main>
  </div>
</body>
</html>
